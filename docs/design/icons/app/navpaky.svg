<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Navpaky App Icon</title>
  <desc id="logo-desc">Two 3D keyboard keycaps side by side inside a dark squircle: a glowing golden-rimmed cobalt-blue keycap with Ukrainian letter Ї on the left, and a dark graphite keycap with Latin letter Q on the right, connected by top and bottom luminous curved swap arrows.</desc>
  <defs>
    <filter id="plateShadow" x="-12%" y="-10%" width="124%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#05070B" flood-opacity="0.45"/>
    </filter>
    <filter id="goldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6.5" result="blur"/>
    </filter>
    <filter id="yiGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="arrowGlow" x="-20%" y="-25%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="2.4" result="aglow"/>
      <feMerge>
        <feMergeNode in="aglow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#323741"/>
      <stop offset="45%" stop-color="#23272F"/>
      <stop offset="100%" stop-color="#171A20"/>
    </linearGradient>
    <linearGradient id="plateRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B0B9C8"/>
      <stop offset="22%" stop-color="#68707E"/>
      <stop offset="78%" stop-color="#383D46"/>
      <stop offset="100%" stop-color="#4A505C"/>
    </linearGradient>

    <linearGradient id="blueSkirtSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D578F"/>
      <stop offset="55%" stop-color="#142C54"/>
      <stop offset="100%" stop-color="#091732"/>
    </linearGradient>
    <linearGradient id="blueSkirtBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16315C"/>
      <stop offset="100%" stop-color="#08142C"/>
    </linearGradient>
    <linearGradient id="blueFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3E6BA6"/>
      <stop offset="55%" stop-color="#2B5287"/>
      <stop offset="100%" stop-color="#1F3E6B"/>
    </linearGradient>
    <linearGradient id="blueFaceStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BA5D9"/>
      <stop offset="60%" stop-color="#36629B"/>
      <stop offset="100%" stop-color="#1C3963"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.15"/>
      <stop offset="18%" stop-color="#FDE68A" stop-opacity="0.82"/>
      <stop offset="85%" stop-color="#FACC15" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="darkSkirtRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#585247"/>
      <stop offset="55%" stop-color="#36322B"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="darkSkirtLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D483F"/>
      <stop offset="55%" stop-color="#38332B"/>
      <stop offset="100%" stop-color="#15171C"/>
    </linearGradient>
    <linearGradient id="darkSkirtBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25282F"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="darkFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#575C65"/>
      <stop offset="55%" stop-color="#474C54"/>
      <stop offset="100%" stop-color="#3A3E46"/>
    </linearGradient>
    <linearGradient id="darkFaceStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#808794"/>
      <stop offset="100%" stop-color="#343840"/>
    </linearGradient>

    <linearGradient id="arrowStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="82%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="arrowFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#93C5FD" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.32"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#plateFill)" stroke="url(#plateRim)" stroke-width="3" filter="url(#plateShadow)"/>

  <g filter="url(#arrowGlow)">
    <path d="M 82 77
             C 100 47, 144 45, 168 65
             L 174 54
             L 181 79
             L 155 76
             L 162 69
             C 142 54, 103 55, 82 77 Z"
          fill="url(#arrowFill)"
          stroke="url(#arrowStroke)"
          stroke-width="2.0"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>

  <g filter="url(#arrowGlow)" transform="rotate(180 128 128)">
    <path d="M 82 77
             C 100 47, 144 45, 168 65
             L 174 54
             L 181 79
             L 155 76
             L 162 69
             C 142 54, 103 55, 82 77 Z"
          fill="url(#arrowFill)"
          stroke="url(#arrowStroke)"
          stroke-width="2.0"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>

  <g id="keycap-left" transform="translate(92 0)">
    <rect x="40" y="94" width="84" height="74" rx="16" fill="#F59E0B" opacity="0.38" filter="url(#goldGlow)"/>
    <rect x="40" y="87" width="84" height="79" rx="15" fill="url(#blueSkirtSide)"/>
    <path d="M 44 162 L 54 142 L 110 142 L 120 162 Q 116 166 109 166 L 55 166 Q 48 166 44 162 Z" fill="url(#blueSkirtBot)"/>
    <line x1="44" y1="161" x2="53" y2="143" stroke="#061024" stroke-width="1.5" opacity="0.75"/>
    <line x1="120" y1="161" x2="111" y2="143" stroke="#061024" stroke-width="1.5" opacity="0.75"/>
    <rect x="40" y="87" width="84" height="79" rx="15" fill="none" stroke="url(#goldRim)" stroke-width="2.1"/>
    <rect x="49" y="85.5" width="66" height="58" rx="11" fill="url(#blueFace)" stroke="url(#blueFaceStroke)" stroke-width="1.4"/>
    <g filter="url(#yiGlow)">
      <path d="M 71.00 105.00 V 134.00 L 93.00 105.00 V 134.00" fill="none" stroke="#FFFBEB" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 74.96 93.47 Q 82.00 100.72 89.04 93.47" fill="none" stroke="#FFFBEB" stroke-width="4.35" stroke-linecap="round"/>
    </g>
  </g>

  <g id="keycap-right" transform="translate(-92 0)">
    <rect x="132" y="90" width="84" height="79" rx="15" fill="#06080C" opacity="0.65" filter="url(#plateShadow)"/>
    <rect x="132" y="87" width="84" height="79" rx="15" fill="url(#darkSkirtRight)"/>
    <path d="M 132 100 Q 132 88 142 87 L 144 95 L 144 143 L 136 161 Q 132 156 132 148 Z" fill="url(#darkSkirtLeft)"/>
    <path d="M 136 162 L 146 142 L 202 142 L 212 162 Q 208 166 201 166 L 147 166 Q 140 166 136 162 Z" fill="url(#darkSkirtBot)"/>
    <line x1="136" y1="161" x2="145" y2="143" stroke="#08090C" stroke-width="1.5" opacity="0.8"/>
    <line x1="212" y1="161" x2="203" y2="143" stroke="#08090C" stroke-width="1.5" opacity="0.8"/>
    <rect x="132" y="87" width="84" height="79" rx="15" fill="none" stroke="#282C34" stroke-width="1.2"/>
    <rect x="141" y="85.5" width="66" height="58" rx="11" fill="url(#darkFace)" stroke="url(#darkFaceStroke)" stroke-width="1.4"/>
    <ellipse cx="174" cy="114.5" rx="13.5" ry="15" fill="none" stroke="#E8ECF2" stroke-width="5.8"/>
    <path d="M 178.5 125.5 L 189.5 133.5" fill="none" stroke="#E8ECF2" stroke-width="5.8" stroke-linecap="round"/>
  </g>
</svg>
