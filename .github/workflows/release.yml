name: Release

# Builds, signs, packs and publishes Navpaky to GitHub Releases (design D4 of
# add-auto-update-and-installer; docs/release.md). Pull requests never run this workflow, and
# the signing secret lives in the `release` environment, which only pushed `v*` tags enter; a
# manual run is a dry run even when it targets a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pack without publishing (dry run), such as 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # Only tag runs enter the environment that holds the signing secret; a dry run packs
    # unsigned and publishes nothing.
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || '' }}
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      VPK_VERSION: 1.2.161
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Not a semantic version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet publish src/Navpaky.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -p:Version=$env:VERSION -o publish

      - name: Install vpk
        run: dotnet tool install vpk --version ${{ env.VPK_VERSION }} --tool-path .tools

      # A tag never publishes unsigned code: Navpaky refuses updates its publisher did not sign.
      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
          SIGN_PARAMS: ${{ github.event_name == 'push' && secrets.VPK_SIGN_PARAMS || '' }}
        run: |
          $pack = @(
            'pack', '--packId', 'navpaky-app', '--packVersion', $env:VERSION,
            '--packDir', 'publish', '--mainExe', 'Navpaky.App.exe', '--packTitle', 'Navpaky',
            '--packAuthors', 'Pavlo Yeremenko', '--icon', 'src/Navpaky.App/Navpaky.ico',
            '--runtime', 'win-x64', '--shortcuts', 'StartMenuRoot',
            '--delta', 'None', '--exclude', '\.(pdb|xml)$', '--outputDir', 'releases')
          # A dry run never signs, even if a secret of that name exists outside the environment.
          if ($env:EVENT_NAME -eq 'push') {
            if (-not $env:SIGN_PARAMS) {
              throw 'VPK_SIGN_PARAMS is not set in the release environment.'
            }
            $pack += @('--signParams', $env:SIGN_PARAMS)
          }
          & .tools/vpk @pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The install wizard carries this release's Setup.exe (design D8 of add-install-wizard).
      - name: Publish the install wizard
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $setup = (Resolve-Path releases/navpaky-app-win-Setup.exe).Path
          dotnet publish src/Navpaky.Setup -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:Version=$env:VERSION "-p:EmbeddedSetupPath=$setup" -o setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signed with the packages' certificate, and published only when the wizard and the
      # Setup.exe inside it carry a valid signature from that one publisher.
      - name: Sign the install wizard
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGN_PARAMS: ${{ secrets.VPK_SIGN_PARAMS }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          cmd /c "`"$($signtool.FullName)`" sign $env:SIGN_PARAMS setup\NavpakySetup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wizard = Get-AuthenticodeSignature setup/NavpakySetup.exe
          $inside = Get-AuthenticodeSignature releases/navpaky-app-win-Setup.exe
          if ($wizard.Status -ne 'Valid' -or $inside.Status -ne 'Valid' -or
              $wizard.SignerCertificate.Thumbprint -ne $inside.SignerCertificate.Thumbprint) {
            throw "Wizard $($wizard.Status), setup $($inside.Status), or two publishers."
          }

      - name: Keep dry-run packages
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: releases-${{ steps.version.outputs.value }}
          path: |
            releases/
            setup/NavpakySetup.exe

      - name: Upload to GitHub Releases
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $upload = @(
            'upload', 'github', '--repoUrl', "https://github.com/$env:REPOSITORY",
            '--token', $env:GITHUB_TOKEN, '--publish', '--releaseName', "Navpaky $env:VERSION",
            '--tag', "v$env:VERSION", '--outputDir', 'releases')
          if ($env:VERSION.Contains('-')) {
            $upload += '--pre'
          }
          & .tools/vpk @upload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "v$env:VERSION" setup/NavpakySetup.exe --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
